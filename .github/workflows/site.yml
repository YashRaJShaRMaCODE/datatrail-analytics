name: Casebook checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/build_casebook.py
      - run: git diff --exit-code -- site/data/casebook.json
      - run: node --check site/app.js
      - run: node --check site/casebook-logic.js
      - run: node --test tests/test_casebook_logic.mjs
      - run: python -m json.tool site/data/casebook.json > /dev/null
